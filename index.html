<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Fixed Neon Kaleidoscope</title><style>
body{margin:0;padding:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden;height:100vh;user-select:none;-webkit-user-select:none;}
hdr{text-align:center;padding:8px 0;background:rgba(10,10,10,0.95);border-bottom:1px solid #111;position:absolute;top:0;left:0;right:0;height:30px;z-index:15;}
.w-txt{color:#FFD700;font-size:18px;font-weight:bold;text-shadow:0 0 10px #FFD700;margin:0;}
.toolbar{background:rgba(15,15,15,0.98);border-bottom:1px solid #222;padding:10px;box-sizing:border-box;position:absolute;top:46px;left:0;right:0;height:90px;z-index:15;display:flex;flex-direction:column;gap:8px;}
.row{display:flex;justify-content:space-around;align-items:center;gap:10px;}
.control-group{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:bold;color:#ccc;}
input[type="range"]{width:80px;accent-color:#FFD700;}
.btn{background:#222;color:#fff;border:1px solid #444;padding:6px 12px;font-weight:bold;font-size:13px;border-radius:6px;cursor:pointer;}
.clear-btn{background:#500;border-color:#800;}
.spin-btn{background:#2b6cb0;border-color:#3182ce;}
.palette{display:flex;gap:10px;overflow-x:auto;padding:2px;justify-content:center;width:100%;}
.dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-sizing:border-box;transition:transform 0.1s;}
.dot.active{border-color:#fff;transform:scale(1.25);}
#canvas-container{position:absolute;top:136px;bottom:0;left:0;right:0;background:#000;z-index:5;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
</style></head><body>
<hdr><div class="w-txt">Welcome To The Kaleidoscope Drawing Pad</div></hdr>
<div class="toolbar">
    <div class="row">
        <div class="control-group"><label>Slices:</label><input type="range" id="slices" min="4" max="36" value="12" step="2" onchange="document.getElementById('sVal').innerText=this.value"><span id="sVal" style="color:#FFD700;width:16px;">12</span></div>
        <div class="control-group"><label>Size:</label><input type="range" id="size" min="2" max="25" value="6"></div>
        <!-- Updated Spin Speed Control Group -->
        <div class="control-group">
            <label>⚡ Speed:</label>
            <input type="range" id="speed" min="1" max="10" value="3" onchange="document.getElementById('spdVal').innerText=this.value">
            <span id="spdVal" style="color:#FFD700;width:16px;">3</span>
        </div>
        <button class="btn spin-btn" id="spinToggle" onclick="toggleSpin()">🔄 Spin: OFF</button>
        <button class="btn clear-btn" onclick="clearCanvas()">🗑️ Clear</button>
    </div>
    <div class="row"><div class="palette" id="palette"></div></div>
</div>
<div id="canvas-container"><canvas id="paintCanvas"></canvas></div>
<script>
const canvas=document.getElementById('paintCanvas'),ctx=canvas.getContext('2d'),container=document.getElementById('canvas-container');
const memCan=document.createElement('canvas'),memCtx=memCan.getContext('2d');
let isDrawing=false,lastX=0,lastY=0,curColor='#00FFFF',isSpinning=false,spinAngle=0;
const neonColors=['#00FFFF','#FF00FF','#00FF00','#FFD700','#FF3333','#33FFF6','#9D33FF','#FF55BB','#FFFFFF'];
function resizeCanvas(){
    const w=container.clientWidth,h=container.clientHeight;
    canvas.width=w;canvas.height=h;memCan.width=w;memCan.height=h;clearCanvas();
}
function setupPalette(){
    const p=document.getElementById('palette');
    neonColors.forEach((c,i)=>{
        const d=document.createElement('div');d.className='dot';d.style.backgroundColor=c;d.style.boxShadow=`0 0 12px ${c}`;
        if(i===0)d.classList.add('active');
        d.addEventListener('click',()=>{document.querySelectorAll('.dot').forEach(el=>el.classList.remove('active'));d.classList.add('active');curColor=c;});
        p.appendChild(d);
    });
}
function clearCanvas(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
    memCtx.fillStyle='#000';memCtx.fillRect(0,0,memCan.width,memCan.height);
}
function drawSymmetry(x1,y1,x2,y2){
    const cx=canvas.width/2,cy=canvas.height/2,slices=parseInt(document.getElementById('slices').value),bSize=parseInt(document.getElementById('size').value),step=(Math.PI*2)/slices;
    let sx=x1-cx,sy=y1-cy,ex=x2-cx,ey=y2-cy;
    if(isSpinning){
        const c=Math.cos(-spinAngle),s=Math.sin(-spinAngle);
        const rx1=sx*c-sy*s,ry1=sx*s+sy*c,rx2=ex*c-ey*s,ry2=ex*s+ey*c;
        sx=rx1;sy=ry1;ex=rx2;ey=ry2;
    }
    memCtx.save();memCtx.translate(cx,cy);memCtx.lineWidth=bSize;memCtx.strokeStyle=curColor;memCtx.shadowBlur=bSize*2.2;memCtx.shadowColor=curColor;
    memCtx.lineCap='round';memCtx.lineJoin='round';
    for(let i=0;i<slices;i++){
        memCtx.rotate(step);
        memCtx.beginPath();memCtx.moveTo(sx,sy);memCtx.lineTo(ex,ey);ctx.stroke();
        memCtx.beginPath();memCtx.moveTo(sx,-sy);memCtx.lineTo(ex,-ey);ctx.stroke();
    }
    memCtx.restore();
}
function toggleSpin(){isSpinning=!isSpinning;document.getElementById('spinToggle').innerText=isSpinning?"🔄 Spin: ON":"🔄 Spin: OFF";}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    if(e.touches&&e.touches.length>0)return{x:e.touches.clientX-rect.left,y:e.touches.clientY-rect.top};
    return{x:e.offsetX,y:e.offsetY};
}
function start(e){isDrawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;}
function move(e){
    if(!isDrawing)return;e.preventDefault();const p=getPos(e);
    drawSymmetry(lastX,lastY,p.x,p.y);
    lastX=p.x;lastY=p.y;
}
function stop(){isDrawing=false;}
function renderLoop(){
    requestAnimationFrame(renderLoop);
    const cx=canvas.width/2,cy=canvas.height/2;
    if(isSpinning){
        // Read slider value and convert to rotation speed (10 multiplier makes it hyper-fast)
        const speedMultiplier=parseInt(document.getElementById('speed').value);
        spinAngle+=(speedMultiplier*0.005);
    }
    ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(spinAngle);ctx.drawImage(memCan,-cx,-cy);ctx.restore();
}
canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',stop);
canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',stop);
window.addEventListener('resize',resizeCanvas);setupPalette();setTimeout(resizeCanvas,150);renderLoop();
</script></body></html>
